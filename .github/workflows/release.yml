name: Release

# Runs when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]

# Needed so GITHUB_TOKEN can create the release.
permissions:
  contents: write

jobs:
  skill-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        run: scripts/build-skill.sh
      # gh is preinstalled on GitHub runners. The zip is the file users
      # upload in Claude desktop, so attach it to the release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/authoring-docs.zip --generate-notes
