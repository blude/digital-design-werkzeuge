name: Release

# Runs when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]

# Needed so GITHUB_TOKEN can create the release.
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip and plugin
        run: |
          scripts/build-skill.sh
          scripts/build-skill.sh --plugin
      # gh is preinstalled on GitHub runners. These are the files users
      # upload in Claude desktop, so attach them to the release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/authoring-docs.zip dist/digital-design.plugin --generate-notes
